[package]
name = "desktop"
version = "0.1.0"
description = "AgentMesh Desktop - Orchestration GUI for Coding Agents"
authors = ["AgentMesh Contributors"]
edition = "2024"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dirs = "5"
agentmesh-core = { path = "../../crates/core" }
agentmesh-daemon = { path = "../../crates/daemon" }
agentmesh-storage = { path = "../../crates/storage" }
agentmesh-workspace = { path = "../../crates/workspace" }
agentmesh-apply = { path = "../../crates/apply" }
agentmesh-adapters = { path = "../../crates/adapters" }
agentmesh-orchestrator = { path = "../../crates/orchestrator" }
